# .harness-dev.conf — example profile for harness-worktree-dev.sh
# Drop a copy at your repo's main checkout root (or pass --profile <file>).
# This example shows a typical Python + Vite/React layout — adjust ports,
# commands, and dirs to your stack.

# Absolute path to the main (non-worktree) checkout that owns the real env
# files and the installed dependency dirs.
MAIN_CHECKOUT="/path/to/main-checkout"

# Env files copied from MAIN_CHECKOUT -> worktree at the same relative path.
# List EVERY variant, frontend included — a missing frontend env is silent.
ENV_FILES=(
  "backend/.env"
  "frontend/.env"
  "frontend/.env.staging"
  "frontend/.env.production"
  "frontend/.env.demo"
)

# Dependency dirs symlinked main -> worktree (no reinstall, no disk waste).
SYMLINKS=(
  "backend/.venv"
  "frontend/node_modules"
)

# Services: name|port|subdir|command   (port 0 = no listening port to free)
SERVICES=(
  "backend|8000|backend|uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
  "frontend|5173|frontend|npm run dev"
  # add more as needed, e.g. an optional webhook forwarder:
  # "webhook|0|.|./scripts/webhook-listen.sh"
)

# Health checks: name|url   (only checked for started services)
HEALTH=(
  "backend|http://localhost:8000/healthz"
  "frontend|http://localhost:5173"
)

# --- testing (consumed by harness-verify.sh and the e2e-browser skill) ---
# All optional; these are the defaults. Set COVERAGE_CMD to get code-level coverage.
APP_URL="http://localhost:5173"                  # base URL the e2e skill opens
TYPECHECK_CMD="npx tsc --noEmit"
TEST_CMD="npx vitest run"
COVERAGE_CMD="npx vitest run --coverage"
BACKEND_DIR="backend"
BACKEND_TEST_CMD="pytest --cov"
